# rcad.toml - Manifesto do projeto para o rcad
# Este arquivo contém a configuração global do projeto rcad.

[project]
name = "rcad"
version = "0.0.1"
description = "CAD paramétrico open-source em Rust"
authors = ["Bruno Fonseca"]
license = "MIT"
repository = "https://github.com/bfonseca/Rcad"

# Tolerância geral do projeto (em mm)
[general_tolerance]
linear = 0.01
angular = 0.1

# Qualidade de tesselação para visualização (fundação A5).
# linear: desvio linear (fração do tamanho da feature quando relative=true; mm caso contrário)
# angular_deg: desvio angular máximo entre facetas vizinhas, em graus (menor = mais liso)
[tessellation]
linear = 0.002
angular_deg = 11.5
relative = true

# Parâmetros globais do projeto
[global_parameters]
# Exemplo: comprimento padrão de extrusão
default_extrusion_length = 10.0

# Mapeamento de cores de superfície por cliente (RGB)
# Os valores são tabelas onde a chave é o tipo de superfície lógica e o valor é um array de 3 inteiros (0-255)
[surface_colors]
# Exemplo: roscas
threads = [255, 165, 0]   # Laranja
# Superfícies de ajuste
fit_surfaces = [0, 255, 0]    # Verde
# Zonas de vedação
sealing_zones = [255, 0, 0]   # Vermelho

# Configuração para componentes guiados por tabelas externas
# Esta secção define como ler e interpretar ficheiros Excel/CSV para parametrização
[external_tables]
# Caminho padrão para as tabelas (relativo ao diretório do projeto)
default_path = "tables"
# Formato padrão (csv, xlsx, xls)
default_format = "xlsx"
# Cache de tabelas em memória (boolean)
cache_in_memory = true

# Configuração de inicialização e projetos recentes
[startup]
# Se verdadeiro, auto-abre o último projeto na inicialização
auto_open_last = true
# Caminho para o ficheiro de projetos recentes (usando diretório de config da plataforma)
# Linux: ~/.config/rcad/recent.json, macOS: ~/Library/Application Support/rcad/recent.json, Windows: %APPDATA%\rcad\recent.json
recent_projects_file = ""  # vazio = padrão da plataforma
# Número máximo de projetos recentes a manter
max_recent_projects = 10

# Configuração de trail log (auditoria/debug)
[trail_log]
# Ativar trail log
enabled = true
# Formato: "jsonl" (JSON Lines) ou "text"
format = "jsonl"
# Nível de detalhe: "full" (tudo), "replay" (apenas ações replicáveis), "errors" (apenas erros)
level = "full"
# Rotação: tamanho máximo em MB antes de rotacionar
max_size_mb = 10
# Manter quantos ficheiros rotacionados
max_files = 5

# Configuração de extensões de ficheiro
[file_extensions]
project = ".rcad"
part = ".rcadprt"
skeleton = ".rcadskl"
assembly = ".rcadasm"
trail = ".rcadlog"
# Registrar associações MIME/OS na primeira execução (requer permissões)
register_on_first_run = true

# Configuração do MCP Server (integração IA)
[mcp_server]
# Ativar servidor MCP
enabled = true
# Porta para transporte TCP (0 = desabilitado, usar apenas stdio)
tcp_port = 0
# Host para TCP (apenas se tcp_port > 0)
tcp_host = "127.0.0.1"
# Permitir operações de escrita (create/modify) via MCP
allow_write = true
# Timeout de requests em segundos
request_timeout_secs = 30